<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006185" />
      <stop offset="100%" stop-color="#00354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76f4e0" />
      <stop offset="100%" stop-color="#00a896" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Scale & Book Legal Symbol -->
  <!-- Book base -->
  <path d="M128 360 C180 340, 230 350, 256 370 C282 350, 332 340, 384 360 L384 210 C332 190, 282 200, 256 220 C230 200, 180 190, 128 210 Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
  <line x1="256" y1="220" x2="256" y2="370" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Justitia Scale Pillar -->
  <line x1="256" y1="120" x2="256" y2="330" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="110" r="16" fill="url(#accentGrad)" />
  
  <!-- Scale Beam -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  
  <!-- Left Pan -->
  <line x1="160" y1="160" x2="140" y2="220" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" />
  <line x1="160" y1="160" x2="180" y2="220" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" />
  <path d="M130 220 C130 240, 190 240, 190 220 Z" fill="url(#accentGrad)" />
  
  <!-- Right Pan -->
  <line x1="352" y1="160" x2="332" y2="220" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" />
  <line x1="352" y1="160" x2="372" y2="220" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" />
  <path d="M322 220 C322 240, 382 240, 382 220 Z" fill="url(#accentGrad)" />
  
  <!-- Text Emblem HBS -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">HBS ALMANACH</text>
</svg>
